<div class="container-fluid">
  <div class="d-flex justify-content-center align-items-center vh-100">
    <div class="col-12">
      <form [formGroup]="signUpForm" (ngSubmit)="onSubmit()">
        <div class="bg-white my-5 mx-auto p-5 signup-card" style="border-radius: 1rem; max-width: 500px">

          <h2 class="fw-bold mb-2 text-center">Đăng ký</h2>
          <p class="text-primary-50 mb-3 text-center">Tạo một tài khoản mới</p>

          <!-- Username -->
          <div class="mb-3">
            <label class="form-label">Địa chỉ email or điện thoại</label>
            <input
              type="text"
              formControlName="username"
              class="form-control"
              [ngClass]="{
                'is-invalid':
                  (signUpForm.controls.username.touched || submitted) &&
                  (signUpForm.controls.username.invalid || errorMessages.username)
              }"
              placeholder="Enter your email or phone"
              autocomplete="off"
            />
            @if (errorMessages.username) {
            <div class="invalid-feedback">
              {{ errorMessages.username }}
            </div>
            }
          </div>

          <!-- Password -->
          <div class="mb-3">
            <label class="form-label">Mật khẩu</label>
            <input
              type="password"
              formControlName="password"
              class="form-control"
              [ngClass]="{
                'is-invalid':
                  (signUpForm.controls.password.touched || submitted) &&
                  signUpForm.controls.password.invalid
              }"
              placeholder="Enter password"
              autocomplete="off"
            />
            @if (signUpForm.controls.password.errors) {
            <div class="invalid-feedback">Mật khẩu phải có ít nhất 6 ký tự.</div>
            }
          </div>

          <!-- Confirm Password -->
          <div class="mb-3">
            <label class="form-label">Xác nhận mật khẩu</label>
            <input
              type="password"
              formControlName="confirmPassword"
              class="form-control"
              [ngClass]="{
                'is-invalid':
                  (signUpForm.controls.confirmPassword.touched || submitted) &&
                  (signUpForm.controls.confirmPassword.invalid || errorMessages.confirmPassword)
              }"
              placeholder="Confirm password"
              autocomplete="off"
            />
            @if (errorMessages.confirmPassword) {
            <div class="invalid-feedback">
              {{ errorMessages.confirmPassword }}
            </div>
            }
          </div>

          <!-- Terms -->
          <div class="form-check mb-3">
            <input type="checkbox" class="form-check-input" />
            <label class="form-check-label"> Tôi chấp nhận các điều khoản </label>
          </div>

          <!-- Submit -->
          <button class="btn btn-primary w-100" type="submit">Đăng ký</button>

          <!-- Already have an account -->
          <div class="text-center mt-3">
            <p class="text-muted">
              Tạo tài khoản?
              <a [routerLink]="['/signIn']">Đăng nhập</a>
            </p>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
